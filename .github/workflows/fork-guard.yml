name: fork-guard

on:
  push:
    branches:
      - main
  pull_request:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  guard:
    name: Verify, version identity, plugin validity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The inherited-skill drift audit diffs against upstream/main and
          # needs a real merge base, so a shallow clone cannot support it.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run every read-only guard and its test suites
        run: npm run verify:all

      - name: Check append-only ledgers (PR diff vs base)
        if: github.event_name == 'pull_request'
        run: node scripts/append-only-gate.mjs --range "${{ github.event.pull_request.base.sha }}"

      - name: Check append-only ledgers (pushed range)
        if: github.event_name == 'push'
        run: node scripts/append-only-gate.mjs --range "${{ github.event.before }}"

      - name: Fetch upstream for the drift audit
        run: |
          git remote add upstream https://github.com/mattpocock/skills.git
          git fetch --no-tags upstream main

      # Fail-closed: with no readable upstream ref this exits 2 instead of
      # printing a green line over an empty audit.
      - name: Inherited-skill drift audit
        run: npm run verify:upstream

      - name: Validate Claude plugin
        run: npx --yes @anthropic-ai/claude-code plugin validate . --strict
        continue-on-error: false
